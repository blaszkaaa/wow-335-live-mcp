name: Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build native DLL transport (Win32)
        run: |
          cmake -S native_bridge -B build/native-bridge -A Win32
          cmake --build build/native-bridge --config Release
      - name: Check Python syntax
        run: python -m compileall -q server.py tests native_bridge
      - name: Check Lua syntax
        run: |
          python -m pip install 'luaparser>=4,<5'
          python -c "from pathlib import Path; from luaparser import ast; ast.parse(Path('WoWMCPData/WoWMCPData.lua').read_text(encoding='utf-8'))"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
