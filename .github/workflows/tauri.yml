name: Tauri Windows Desktop

on:
  push:
    branches: ["main", "fix/windows-console-and-ui-scaling"]
    paths:
      - "desktop-next/**"
      - "desktop_service.py"
      - "native_bridge/**"
      - "ui_models.py"
      - "tests/test_desktop_service.py"
      - ".github/workflows/tauri.yml"
  pull_request:
    paths:
      - "desktop-next/**"
      - "desktop_service.py"
      - "native_bridge/**"
      - "ui_models.py"
      - "tests/test_desktop_service.py"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"
      - name: Test Python service and legacy MCP
        run: python -m unittest discover -s tests -v
      - name: Package background service
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --hidden-import server --add-data "WoWMCPData/WoWMCPData.lua;WoWMCPData" --name wow-mcp-service desktop_service.py
          New-Item -ItemType Directory -Force desktop-next/src-tauri/binaries | Out-Null
          Copy-Item dist/wow-mcp-service.exe desktop-next/src-tauri/binaries/wow-mcp-service-x86_64-pc-windows-msvc.exe
      - name: Prepare Tauri icons
        run: python desktop-next/scripts/generate_icons.py
      - name: Install frontend packages
        working-directory: desktop-next
        run: npm install
      - name: Validate React and TypeScript
        working-directory: desktop-next
        run: npm run build
      - name: Build Tauri NSIS installer
        working-directory: desktop-next
        run: npm run tauri build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WoW-MCP-Control-Center-Tauri-Windows
          path: desktop-next/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
