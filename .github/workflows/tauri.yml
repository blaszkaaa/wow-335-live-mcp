name: Tauri Windows Desktop

on:
  push:
    branches: ["main", "fix/windows-console-and-ui-scaling"]
    paths:
      - "desktop-next/**"
      - "desktop_service.py"
      - "game_launcher.py"
      - "WoWMCPData/**"
      - "native_bridge/**"
      - "ui_models.py"
      - "tests/test_desktop_service.py"
      - "tests/test_game_launcher.py"
      - "tests/test_native_setup.py"
      - ".github/workflows/tauri.yml"
  pull_request:
    paths:
      - "desktop-next/**"
      - "desktop_service.py"
      - "native_bridge/**"
      - "ui_models.py"
      - "tests/test_desktop_service.py"
      - "tests/test_native_setup.py"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"
      - name: Test Python service and legacy MCP
        run: python -m unittest discover -s tests -v
      - name: Build pinned Win32 native adapter
        shell: pwsh
        run: ./native_bridge/adapter/build-offline.ps1
      - name: Prepare pinned native runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/brues-code/LichLoader/releases/download/v1.1.0/LichLoader-v1.1.0.zip"
          $expected = "363df95e1dca2237211dab197e06320e8a6dabd33b83c70bc182d6baf4167d8b"
          $archive = Join-Path $env:RUNNER_TEMP "LichLoader-v1.1.0.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned LichLoader archive checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "lichloader-release"
          Expand-Archive -Path $archive -DestinationPath $extract
          New-Item -ItemType Directory -Force native_runtime | Out-Null
          foreach ($file in @("LichLoader.exe", "LichCore.dll")) {
            $hits = @(Get-ChildItem $extract -Recurse -File -Filter $file)
            if ($hits.Count -ne 1) { throw "Expected one $file in verified release" }
            Copy-Item $hits[0].FullName "native_runtime/$file"
          }
          Copy-Item "build/wowmcp-native-lua/build/Release/WrathClassicAPI.dll" "native_runtime/WoWMCPNativeLua.dll"
          foreach ($file in @("LichLoader.exe", "LichCore.dll", "WoWMCPNativeLua.dll")) {
            if (-not (Test-Path "native_runtime/$file")) { throw "Missing $file" }
          }
      - name: Archive corresponding source for modified GPL DLL
        shell: pwsh
        run: |
          $source = "build/wowmcp-native-lua/WrathClassicAPI"
          $out = "build/native-corresponding-source"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($file in @("src", "cmake", "AddOns", "external", "CMakeLists.txt", "LICENSE", ".gitmodules")) {
            Copy-Item "$source/$file" "$out/" -Recurse -Force
          }
          Copy-Item "native_bridge/adapter/build-offline.ps1" "$out/build-offline.ps1"
          Copy-Item "native_bridge/adapter/README.md" "$out/ADAPTER-README.md"
          Copy-Item "WoWMCPData/WoWMCPData.lua" "$out/WoWMCPData.lua"
          Compress-Archive -Path "$out/*" -DestinationPath "WoWMCP-Native-Corresponding-Source.zip" -CompressionLevel Optimal -Force
      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: WoWMCP-Native-Corresponding-Source
          path: WoWMCP-Native-Corresponding-Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Package background service
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --hidden-import server --add-data "WoWMCPData;WoWMCPData" --add-data "native_runtime;native_runtime" --name wow-mcp-service desktop_service.py
          New-Item -ItemType Directory -Force desktop-next/src-tauri/binaries | Out-Null
          Copy-Item dist/wow-mcp-service.exe desktop-next/src-tauri/binaries/wow-mcp-service-x86_64-pc-windows-msvc.exe
      - name: Prepare Tauri icons
        run: python desktop-next/scripts/generate_icons.py
      - name: Install frontend packages
        working-directory: desktop-next
        run: npm install
      - name: Validate React and TypeScript
        working-directory: desktop-next
        run: npm run build
      - name: Build Tauri NSIS installer
        working-directory: desktop-next
        run: npm run tauri build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WoW-MCP-Control-Center-Tauri-Windows
          path: desktop-next/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
